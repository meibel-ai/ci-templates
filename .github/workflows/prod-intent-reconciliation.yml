name: Prod Intent Reconciliation

# Reusable workflow. Caller pattern (see gitops-platform, manifests):
#
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#
#   jobs:
#     reconcile:
#       if: github.event.pull_request.merged == true
#       uses: meibel-ai/ci-templates/.github/workflows/prod-intent-reconciliation.yml@v1
#       with:
#         promote-workflow-name: "Promote Workloads to Production"
#       permissions:
#         contents: read
#         pull-requests: write
#         actions: read
#
# What it catches:
#   A merged PR whose body declares Production intent (Environments Affected
#   checkbox) but whose diff misses every trigger path of the promote workflow.
#   That mismatch means the tag never moves and prod never syncs — the exact
#   "silent prod miss" failure mode. This workflow fails LOUDLY (comment on
#   the PR + non-zero exit) when it happens; a human then opens a marker PR
#   to fire the promote workflow.
#
# Deployed-on-merge exemption (deployed-on-merge-paths input): some prod
# deploys happen on merge itself — root-app ApplicationSets and HEAD-tracked
# platform workloads (e.g. gitops-platform environments/hub/** and
# infra/platform/**, the metering/opsvis hub model). For a PR whose diff
# includes such a path, no promote run is owed; reconciliation passes and
# comments "deployed-on-merge" so the audit trail explains the absence of a
# promote run. Without this, hub platform PRs fail loudly and the marker-PR
# remediation they get would move an unrelated service's v1 tag.
#
# What it does NOT catch:
#   - PRs whose body has Production unchecked when it should be checked
#     (that's a body-vs-diff mismatch; prod-pr-compliance-gate.yml covers
#     the case where the diff touches prod paths).
#   - Direct-to-main pushes (no PR = no intent declaration to reconcile
#     against). The compliance gate on push handles that surface.

on:
  workflow_call:
    inputs:
      promote-workflow-file:
        required: true
        type: string
        description: >-
          The file name (e.g. "promote-to-prod.yml") of the workflow that
          MUST run when a merged PR declares Production intent. File path
          is used rather than display name because workflows may override
          their run name via `run-name:`, which replaces `name:` in the API.
      wait-seconds:
        required: false
        type: number
        default: 180
        description: >-
          Seconds to wait after merge for the promote workflow to appear on
          the merge SHA. GitHub's push-event dispatch is normally within 60s;
          180s is a comfortable margin.
      deployed-on-merge-paths:
        required: false
        type: string
        default: ""
        description: >-
          Newline-separated glob patterns ('**' crosses '/', '*' does not)
          for paths whose prod deploy happens on merge itself (root-app
          ApplicationSet / HEAD-tracked app) rather than via the promote
          workflow's tag move. When no promote run fired and at least one
          changed file matches, reconciliation passes as a
          deployed-on-merge change instead of failing. Leave empty to keep
          the strict behavior.

jobs:
  reconcile:
    name: Reconcile prod intent vs promote workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check intent + promote workflow run
        uses: actions/github-script@v7
        env:
          PROMOTE_WORKFLOW_FILE: ${{ inputs.promote-workflow-file }}
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
          DEPLOYED_ON_MERGE_PATHS: ${{ inputs.deployed-on-merge-paths }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            if (!pr || !pr.merged) {
              core.info("PR is not merged; nothing to reconcile.");
              return;
            }

            const body = pr.body || "";

            // Detect the DCF "Environments Affected" -> Production checkbox.
            // Matches both `- [x] **Production**` and `- [x] Production`,
            // case-insensitive. Only inside the Environments Affected section.
            const envSectionMatch = body.match(
              /##\s+Environments Affected\s*\n([\s\S]*?)(?=\n##\s+|$)/i
            );
            if (!envSectionMatch) {
              core.info("PR body has no 'Environments Affected' section — assuming dev-only.");
              return;
            }
            const productionChecked = /- \[[xX]\]\s*(?:\*\*)?Production(?:\*\*)?/i.test(envSectionMatch[1]);
            if (!productionChecked) {
              core.info("Production not checked in Environments Affected — this was a dev PR. Nothing owed.");
              return;
            }

            const promoteFile = process.env.PROMOTE_WORKFLOW_FILE;
            core.info(`PR #${pr.number} declares Production intent. Reconciling against workflow file "${promoteFile}".`);

            const mergeSha = pr.merge_commit_sha;
            if (!mergeSha) {
              core.setFailed(`PR #${pr.number} is marked merged but has no merge_commit_sha — cannot reconcile.`);
              return;
            }

            // Wait for GitHub to enqueue the merge-triggered workflow runs.
            const waitMs = Number(process.env.WAIT_SECONDS) * 1000;
            core.info(`Waiting ${process.env.WAIT_SECONDS}s for promote workflow to appear on ${mergeSha}...`);
            await new Promise((r) => setTimeout(r, waitMs));

            // Query runs by workflow file directly. Workflow `run-name:`
            // overrides the display name in the run's `name` field, so name
            // matching is unreliable. `workflow_id` accepts the file name
            // (e.g. "promote-to-prod.yml") and matches on the workflow file.
            const runsResp = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: promoteFile,
              head_sha: mergeSha,
              per_page: 100,
            });

            const matched = runsResp.data.workflow_runs;

            if (matched.length > 0) {
              const summary = matched
                .map((r) => `- ${r.name} (${r.status}/${r.conclusion || "in-progress"}) — ${r.html_url}`)
                .join("\n");
              core.info(`Reconciliation clean. Matching runs on merge SHA:\n${summary}`);
              return;
            }

            // Deployed-on-merge exemption: some prod deploys happen on merge
            // itself (root-app ApplicationSets, HEAD-tracked platform
            // workloads) — no promote-workflow run is owed for those.
            const exemptPatterns = (process.env.DEPLOYED_ON_MERGE_PATHS || "")
              .split("\n")
              .map((s) => s.trim())
              .filter(Boolean);
            if (exemptPatterns.length > 0) {
              const globToRegExp = (pattern) => {
                let re = "";
                for (let i = 0; i < pattern.length; i++) {
                  const c = pattern[i];
                  if (c === "*") {
                    if (pattern[i + 1] === "*") {
                      i++;
                      if (pattern[i + 1] === "/") i++;
                      re += ".*";
                    } else {
                      re += "[^/]*";
                    }
                  } else if ("\\^$.|?+()[]{}".includes(c)) {
                    re += "\\" + c;
                  } else {
                    re += c;
                  }
                }
                return new RegExp("^" + re + "$");
              };
              const patterns = exemptPatterns.map(globToRegExp);
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const exemptMatch = files
                .map((f) => f.filename)
                .find((name) => patterns.some((re) => re.test(name)));
              if (exemptMatch) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: [
                    `> **Prod intent reconciliation PASSED (deployed-on-merge).**`,
                    ``,
                    `No \`${promoteFile}\` run is owed for merge commit \`${mergeSha}\`: \`${exemptMatch}\` deploys to prod on merge itself (root app / HEAD-tracked app), not via the promote workflow's tag move.`,
                    ``,
                    `<sub>Emitted by the shared prod-intent-reconciliation workflow (ci-templates).</sub>`,
                  ].join("\n"),
                });
                core.info(
                  `Reconciliation clean (deployed-on-merge): ${exemptMatch} deploys on merge; no ${promoteFile} run owed for ${mergeSha}.`
                );
                return;
              }
            }

            // Silent prod miss: intent declared, no promote workflow fired.
            const commentBody = [
              `> **Prod intent reconciliation FAILED.**`,
              ``,
              `PR #${pr.number} declared Production intent (Environments Affected → Production checked), but no run of \`${promoteFile}\` was found on the merge commit \`${mergeSha}\` within ${process.env.WAIT_SECONDS}s.`,
              ``,
              `**Why this happens:** the PR's diff did not touch any of \`${promoteFile}\`'s trigger paths, so the workflow was never scheduled. The \`<service>/v1\` tag will not move and ArgoCD will not sync prod for this change.`,
              ``,
              `**How to fix:** open a promotion-marker PR that touches a triggering path (typically \`apps/workloads/<svc>/envs/prod/values.yaml\` in gitops-platform, or \`<svc>/values-prod.yaml\` in manifests) with a comment referencing this PR. On merge, the promote workflow fires and moves the tag forward past this PR.`,
              ``,
              `<sub>Emitted by the shared prod-intent-reconciliation workflow (ci-templates).</sub>`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: commentBody,
            });

            core.setFailed(
              `PR #${pr.number} declared Production intent but no "${promoteFile}" run fired on merge SHA ${mergeSha}. See PR comment for remediation.`
            );
